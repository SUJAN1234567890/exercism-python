name: Auto-merge Exercism PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # This ensures it ONLY merges if the Exercism bot made the request
    if: github.event.pull_request.user.login == 'exercism-solutions-syncer[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the PR automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --merge "$PR_URL"
